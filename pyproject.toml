[project]
name = "voicecode"
version = "0.1.0"
description = "Live speech-to-code in a single Neovim buffer"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "pynvim>=0.5",
    "pydantic-ai>=1",
    "typer>=0.29.1",
    "rich>=15.0.0",
]

[project.scripts]
voicecode = "voicecode.main:app"

[dependency-groups]
dev = ["pytest>=8", "basedpyright>=1", "ruff>=0.9"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
